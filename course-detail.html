  <style>
    #pageModal {
      display: none;

      align-items: center;
      justify-content: center;

    /* Share icons */
    #shareIcons {
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #shareIcons.open {
      opacity: 1;
      transform: scale(1) translateX(-50%);
      pointer-events: auto;
    }
    .share-icon {
      width: 48px;
      height: 48px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      transition: all 0.35s ease;
    }

/* Offer Banner Styles */
.offer-banner {
  background: linear-gradient(90deg, var(--banner-color, #7c3aed), #8b5cf6);
  animation: gradient 8s ease infinite;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  padding: 14px 0;
}
.offer-banner::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -100%;
  width: 40%;
  height: 300%;
  background: linear-gradient(120deg, rgba(255,255,255,0.25), transparent);
  animation: shine 6s linear infinite;
}
@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes shine {
  0% { transform: translateX(-150%); }
  100% { transform: translateX(400%); }
}

    /* Responsive Toast Notification - Works well on Mobile + Desktop */
    #toast {
      position: fixed;
      bottom: 100px;           /* More space from bottom on mobile */
      left: 50%;
      transform: translateX(-50%);
      background: #1f2937;
      color: white;
      padding: 14px 22px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 10000;
      font-weight: 500;
      max-width: 88vw;         /* Safe for mobile screens */
      text-align: center;
      line-height: 1.45;
      transition: all 0.3s ease;
    }
    
    .dark #toast {
      background: #334155;
    }
    
    #toast.show {
      display: flex;
      animation: toastPop 0.4s ease forwards;
    }
    
    @keyframes toastPop {
      0% { transform: translateX(-50%) translateY(30px); opacity: 0; }
      100% { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    /* Extra mobile optimization */
    @media (max-width: 480px) {
      #toast {
        bottom: 90px;
        padding: 12px 18px;
        font-size: 14.5px;
      }
    }

  </style>
</head>

<script>
  const API_BASE = 'http://localhost:5000/api';
  const urlParams = new URLSearchParams(window.location.search);
  const courseId = urlParams.get('id');

  // Updated: Using 'styloCart' to match cart.html
  let cart = JSON.parse(localStorage.getItem('styloCart')) || [];
  let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

  async function fetchPage(slug) {
    try {
      const res = await fetch(`${API_BASE}/pages/${slug}`);
      if (!res.ok) throw new Error('Page not found');
      const page = await res.json();
      document.getElementById('pageTitle').textContent = page.title;
      document.getElementById('pageContent').innerHTML = page.content;
      document.getElementById('pageModal').classList.add('show');
    } catch (err) {
      console.error(err);
      alert('Could not load page: ' + slug);
    }
  }

  function closePageModal() {
    document.getElementById('pageModal')?.classList.remove('show');
  }

  // Improved Cart Badge Updater (works across all pages)
  function updateCartBadge() {
    const currentCart = JSON.parse(localStorage.getItem('styloCart')) || [];
    const count = currentCart.length;

    document.querySelectorAll('#cartBadge, #cartBadgeBottom').forEach(badge => {
      if (badge) badge.textContent = count;
    });
  }

        // Responsive Toast for course-detail.html
    function showToast(message, icon = '✓') {
      const toast = document.getElementById('toast');
      if (!toast) return;

      document.getElementById('toastIcon').innerHTML = icon;
      document.getElementById('toastMessage').textContent = message;

      toast.classList.add('show');

      // Auto hide after 2.8 seconds (better for mobile)
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2800);
    }

    // Updated Add to Cart with Toast
    function addToCartFromDetail() {
      const title = document.getElementById('courseTitle').textContent.trim();
      const priceText = document.getElementById('coursePrice').textContent;
      const price = parseFloat(priceText.replace('₹', '').replace(/,/g, ''));

      let currentCart = JSON.parse(localStorage.getItem('styloCart')) || [];

      if (currentCart.some(item => item.title === title)) {
        showToast("Already in your cart!", "⚠️");
        return;
      }

      currentCart.push({
        id: courseId || Date.now(),
        title: title,
        price: price,
        image: document.getElementById('courseImage').src || 'https://via.placeholder.com/600x400'
      });

      localStorage.setItem('styloCart', JSON.stringify(currentCart));
      updateCartBadge();

      showToast(`Added "${title}" to cart!`, '🛒');
    }

function addToCartFromRelated(title, price, button) {
  event.stopPropagation(); // safety

  let currentCart = JSON.parse(localStorage.getItem('styloCart')) || [];

  if (currentCart.some(item => item.title === title)) {
    showToast("Already in your cart!", "⚠️");
    return;
  }

  currentCart.push({
    id: Date.now(),
    title: title,
    price: Number(price),
    image: 'https://picsum.photos/id/1015/600/400'
  });

  localStorage.setItem('styloCart', JSON.stringify(currentCart));
  updateCartBadge();

  showToast(`Added "${title}" to cart!`, '🛒');

  // Visual feedback
  if (button) {
    button.classList.add('bg-green-600');
    setTimeout(() => button.classList.remove('bg-green-600'), 600);
  }
}

    // Updated Wishlist with Toast
    function toggleWishlistDetail() {
      const title = document.getElementById('courseTitle').textContent.trim();
      const index = wishlist.indexOf(title);
      const icon = document.getElementById('heartIcon');

      if (index === -1) {
        wishlist.push(title);
        icon.textContent = '♥';
        showToast(`Added "${title}" to wishlist!`, '❤️');
      } else {
        wishlist.splice(index, 1);
        icon.textContent = '♡';
        showToast(`Removed from wishlist`, '🗑️');
      }
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
    }

  function buyNow() {
  if (!courseId) {
    alert("Error: Course ID not found.");
    return;
  }

  const title = document.getElementById('courseTitle').textContent.trim();
  const priceText = document.getElementById('coursePrice').textContent;
  const price = parseFloat(priceText.replace(/[^0-9.]/g, ''));
  const image = document.getElementById('courseImage').src || 'https://picsum.photos/id/1015/300/200';

  let currentCart = JSON.parse(localStorage.getItem('styloCart')) || [];

  // Add course if not already in cart
  const alreadyExists = currentCart.some(item => item.id === courseId);

  if (!alreadyExists) {
    currentCart.push({
      id: courseId,
      title: title,
      price: price,
      image: image
    });
  }

  localStorage.setItem('styloCart', JSON.stringify(currentCart));

  // Redirect to checkout
  window.location.href = "checkout.html";   // ← Change this if your checkout file name is different
}

  function initShareButton() {
    const toggleBtn = document.getElementById('shareToggleBtn');
    const iconsContainer = document.getElementById('shareIcons');

    if (!toggleBtn || !iconsContainer) return;

    const currentUrl = encodeURIComponent(window.location.href);
    const currentTitle = encodeURIComponent(document.title || "Check this amazing course on TheStylo");

    const links = iconsContainer.querySelectorAll('a');
    links[0].href = `https://www.facebook.com/sharer/sharer.php?u=${currentUrl}`;
    links[1].href = `https://twitter.com/intent/tweet?url=${currentUrl}&text=${currentTitle}`;
    links[2].href = `https://api.whatsapp.com/send?text=${currentTitle}%20${currentUrl}`;
    links[3].href = `https://www.linkedin.com/sharing/share-offsite/?url=${currentUrl}`;
    links[4].href = `https://t.me/share/url?url=${currentUrl}&text=${currentTitle}`;
    links[5].href = `https://pinterest.com/pin/create/button/?url=${currentUrl}&description=${currentTitle}`;

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      iconsContainer.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!toggleBtn.contains(e.target) && !iconsContainer.contains(e.target)) {
        iconsContainer.classList.remove('open');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    const html = document.documentElement;
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
    }

    document.getElementById('theme-toggle')?.addEventListener('click', () => {
      html.classList.toggle('dark');
      localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
    });

    updateCartBadge();
    window.addEventListener('storage', updateCartBadge);   // Real-time sync across tabs/pages
    loadCourseDetail();
    initShareButton();
    loadActiveCoupon();
  });

  async function loadCourseDetail() {
    if (!courseId) return;
    try {
      const res = await fetch(`${API_BASE}/courses/${courseId}`);
      if (!res.ok) throw new Error('Course not found');
      const course = await res.json();

      document.getElementById('pageTitle').textContent = `${course.title} - TheStylo`;
      document.getElementById('courseTitle').textContent = course.title;
      document.getElementById('coursePrice').textContent = `₹${Number(course.price).toLocaleString()}`;
      document.getElementById('shortDesc').textContent = course.description || 'Premium mastery course with lifetime access.';
      document.getElementById('categoryBadge').textContent = course.category || 'Uncategorized';
      document.getElementById('levelBadge').textContent = course.level || 'All Levels';
      document.getElementById('courseImage').src = course.image?.startsWith('http') 
        ? course.image : `http://localhost:5000${course.image}`;

      document.getElementById('fullDescription').innerHTML = course.fullDescription || '<p>No detailed description yet.</p>';

      if (wishlist.includes(course.title)) {
        document.getElementById('heartIcon').textContent = '♥';
      }

      loadRelatedCourses(course);

    } catch (err) {
      console.error(err);
      document.getElementById('fullDescription').innerHTML = '<p class="text-red-500">Error loading course.</p>';
    }
  }

    async function loadRelatedCourses(currentCourse) {
  const container = document.getElementById('relatedCoursesGrid');
  if (!container) return;

  try {
    const res = await fetch(`${API_BASE}/courses`);
    if (!res.ok) throw new Error('Failed to load courses');
    let allCourses = await res.json();

    // Get courses from same category, excluding current course
    let related = allCourses.filter(c => 
      c._id !== currentCourse._id && 
      c.category === currentCourse.category
    );

    // If not enough, add latest courses (excluding current)
    if (related.length < 4) {
      const fallback = allCourses
        .filter(c => c._id !== currentCourse._id)
        .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0))
        .slice(0, 8);

      related = [...related, ...fallback];
    }

    // Remove duplicates and limit to exactly 4 courses
    const seen = new Set();
    related = related.filter(course => {
      if (seen.has(course._id)) return false;
      seen.add(course._id);
      return true;
    }).slice(0, 4);

    container.innerHTML = '';

    if (related.length === 0) {
      container.innerHTML = '<p class="col-span-full text-center text-lg opacity-70 py-12">No related courses found yet.</p>';
      return;
    }

    related.forEach(course => {
      const div = document.createElement('div');

      // Mobile: Simple layout (like home/featured courses) - No card, no wishlist
      // Desktop: Keep rich card with hover, description, etc.
      div.innerHTML = `
        <div class="md:hidden cursor-pointer">   <!-- Mobile only - Simple style -->
          <div class="relative">
            <img src="${course.image?.startsWith('http') ? course.image : `http://localhost:5000${course.image || ''}` || 'https://via.placeholder.com/640x360'}" 
                 alt="${course.title}" 
                 class="w-full aspect-video object-cover rounded-xl">

            ${course.level ? `<span class="absolute top-3 left-3 bg-accent text-white text-xs px-3 py-1 rounded-full font-bold shadow">${course.level}</span>` : ''}
          </div>
          
          <div class="mt-4 px-1">
            <h3 class="font-heading font-semibold text-[15.5px] leading-[1.35] line-clamp-2">${course.title}</h3>
          </div>
          
          <div class="flex justify-between items-center mt-3 px-1">
            <span class="text-2xl font-bold text-accent">₹${Number(course.price).toLocaleString()}</span>
            
            <button onclick="event.stopPropagation(); addToCartFromRelated('${course.title.replace(/'/g,"\\'")}', ${course.price}, this)" 
                    class="bg-accent hover:bg-green-700 text-white w-10 h-10 flex items-center justify-center rounded-2xl transition">
              <i class="fas fa-shopping-cart text-lg"></i>
            </button>
          </div>
        </div>

        <!-- Desktop rich card - UNCHANGED -->
        <div class="hidden md:block bg-white dark:bg-darkcard rounded-3xl shadow-card overflow-hidden hover:shadow-glow transition transform hover:-translate-y-2 border border-gray-200 dark:border-gray-700 cursor-pointer">
          <div class="relative aspect-video">
            <img src="${course.image?.startsWith('http') ? course.image : `http://localhost:5000${course.image || ''}` || 'https://via.placeholder.com/640x360'}" 
                 alt="${course.title}" 
                 class="w-full h-full object-cover"/>
            ${course.level ? `<span class="absolute top-4 left-4 bg-accent text-white text-xs font-bold px-3 py-1 rounded-full">${course.level}</span>` : ''}
          </div>
          <div class="p-5">
            <h3 class="text-lg font-heading font-bold mb-2 line-clamp-2">${course.title}</h3>
            <p class="text-sm text-gray-600 dark:text-slate-300 mb-4 line-clamp-2">${course.description || 'Premium mastery course with lifetime access.'}</p>
            <div class="flex justify-between items-center">
              <span class="text-2xl font-bold text-accent">₹${Number(course.price).toLocaleString()}</span>
              <span class="text-sm opacity-70">${course.category || 'Uncategorized'}</span>
            </div>
          </div>
        </div>
      `;

      // Click handler - works for both mobile and desktop
      div.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        window.location.href = `course-detail.html?id=${course._id}`;
      });

      container.appendChild(div);
    });

  } catch (err) {
    console.error('Related courses error:', err);
    container.innerHTML = '<p class="col-span-full text-center text-red-500 py-8">Could not load related courses.</p>';
  }
}

// ==================== OFFER BANNER & COUPON MODAL ====================
let currentActiveCoupon = null;

function loadActiveCoupon() {
  const coupons = JSON.parse(localStorage.getItem('styloCoupons')) || [];
  const now = new Date();

  currentActiveCoupon = coupons.find(c => 
    c.isActive && new Date(c.expiry) > now && 
    (c.maxUsage === 0 || (c.usedCount || 0) < c.maxUsage)
  );

  const banner = document.getElementById('offerBanner');
  if (currentActiveCoupon) {
    banner.classList.remove('hidden');
    banner.style.setProperty('--banner-color', currentActiveCoupon.bannerColor || '#7c3aed');
    document.getElementById('bannerHeadline').textContent = currentActiveCoupon.headline;
    startLiveCountdown(new Date(currentActiveCoupon.expiry));
  } else {
    banner.classList.add('hidden');
  }
}

function startLiveCountdown(expiryDate) {
  const countdownEl = document.getElementById('countdown');
  const modalEl = document.getElementById('modalCountdown');

  setInterval(() => {
    const diff = expiryDate - new Date();
    if (diff <= 0) return loadActiveCoupon();

    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const timeStr = `${h}h ${m}m ${s}s`;
    countdownEl.textContent = timeStr;
    modalEl.textContent = timeStr;
  }, 1000);
}

function showCouponModal() {
  if (!currentActiveCoupon) return;

  document.getElementById('modalHeadline').textContent = currentActiveCoupon.headline || "Special Offer";
  document.getElementById('modalCode').textContent = currentActiveCoupon.code;

  const descEl = document.getElementById('modalDescription');
  if (currentActiveCoupon.shortDescription && currentActiveCoupon.shortDescription.trim() !== '') {
    descEl.textContent = currentActiveCoupon.shortDescription;
    descEl.style.display = 'block';
  } else {
    descEl.style.display = 'none';
  }

  const modal = document.getElementById('couponModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function hideCouponModal() {
  const modal = document.getElementById('couponModal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

function copyCouponCode() {
  if (!currentActiveCoupon) return;
  navigator.clipboard.writeText(currentActiveCoupon.code).then(() => {
    const btn = document.querySelector('.copy-btn');
    const original = btn.innerHTML;
    btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
    btn.classList.add('!bg-green-600');
    setTimeout(() => {
      btn.innerHTML = original;
      btn.classList.remove('!bg-green-600');
    }, 2000);
  });
}

        // Smart Navigation for TheStylo.html & TheStylo.html
    function isMobile() {
      return window.innerWidth < 768 || /Mobi|Android/i.test(navigator.userAgent);
    }

    function goToHome() {
      if (isMobile()) {
        window.location.href = 'TheStylo.html';
      } else {
        window.location.href = 'TheStylo.html';
      }
    }

    function goToCourses() {
      if (isMobile()) {
        // Go to TheStylo.html and force open Courses view
        window.location.href = 'TheStylo.html?view=courses';
      } else {
        window.location.href = 'TheStylo.html#courses';
      }
    }

</script>
